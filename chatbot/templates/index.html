<!DOCTYPE html>
<html>
<head>
    <title>Jarvis AI</title>
    <style>
        body {
            background: black;
            color: cyan;
            font-family: Arial;
            text-align: center;
        }

        #chatbox {
            height: 80vh;
            overflow-y: auto;
        }

        .user {
            color: lightgreen;
        }

        .bot {
            color: cyan;
        }
    </style>
</head>
<body>

<h1>⚡ JARVIS AI</h1>

<div id="chatbox"></div>

<input id="input" placeholder="Ask me anything...">
<button onclick="sendMessage()">Send</button>

<script>
async function sendMessage() {
    let input = document.getElementById("input");
    let message = input.value;

    if (!message) return;

    let chatbox = document.getElementById("chatbox");

    chatbox.innerHTML += `<p class="user">You: ${message}</p>`;
    input.value = "";

    let response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });

    let data = await response.json();

    chatbox.innerHTML += `<p class="bot">Jarvis: ${data.reply}</p>`;
}
</script>

</body>
</html>
