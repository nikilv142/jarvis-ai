<!DOCTYPE html>
<html>
<head>
    <title>Jarvis AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2 class="title">AI Assistant 🤖</h2>

<div class="chat-box" id="chat-box">
    <div class="bot">Hello Sir 👋 I am your AI Assistant</div>
</div>

<div class="input-area">
    <input type="text" id="input" placeholder="Type or speak...">
    <button onclick="send()">Send</button>
    <button onclick="startVoice()">🎤</button>
</div>

<script>
function send() {
    let input = document.getElementById("input");
    let msg = input.value;

    if (!msg) return;

    let chat = document.getElementById("chat-box");

    chat.innerHTML += `<div class="user">${msg}</div>`;

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    })
    .then(res => res.json())
    .then(data => {
        chat.innerHTML += `<div class="bot">${data.reply}</div>`;
        chat.scrollTop = chat.scrollHeight;

        // 🔊 Voice output
        speak(data.reply);
    });

    input.value = "";
}

// 🎤 Voice input
function startVoice() {
    let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event) {
        document.getElementById("input").value = event.results[0][0].transcript;
    };
}

// 🔊 Voice output
function speak(text) {
    let speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
