<!DOCTYPE html>
<html>
<head>
    <title>Iron Man Jarvis</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: cyan;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            text-shadow: 0 0 20px cyan;
        }

        #status {
            margin: 10px;
            font-size: 18px;
        }

        /* 🌀 Jarvis Circle */
        .circle {
            width: 200px;
            height: 200px;
            border: 4px solid cyan;
            border-radius: 50%;
            margin: 30px auto;
            box-shadow: 0 0 30px cyan;
            animation: rotate 5s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .listening {
            border-color: lime;
            box-shadow: 0 0 50px lime;
        }

        .speaking {
            border-color: red;
            box-shadow: 0 0 50px red;
        }

        #chatbox {
            height: 50vh;
            overflow-y: auto;
            padding: 10px;
        }

        .msg {
            margin: 10px;
        }

        .user { color: lightgreen; }
        .bot { color: cyan; }
    </style>
</head>

<body>

<h1>⚡ JARVIS AI</h1>
<div id="status">Waiting for "Hey Jarvis"...</div>

<div id="jarvisCircle" class="circle"></div>

<div id="chatbox"></div>

<script>
let recognition;
let isSpeaking = false;
let isActive = false;

function addMessage(text, className) {
    let chatbox = document.getElementById("chatbox");
    let div = document.createElement("div");
    div.className = "msg " + className;
    div.innerHTML = text;
    chatbox.appendChild(div);
    chatbox.scrollTop = chatbox.scrollHeight;
}

// 🎤 Start Jarvis
function startJarvis() {
    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = true;
    recognition.lang = "en-US";

    recognition.onresult = function(event) {
        let text = event.results[event.results.length - 1][0].transcript.toLowerCase();

        console.log("Heard:", text);

        // Stop speaking if user talks
        if (isSpeaking) {
            speechSynthesis.cancel();
            isSpeaking = false;
        }

        // Wake word
        if (text.includes("hey jarvis")) {
            document.getElementById("status").innerText = "Listening...";
            document.getElementById("jarvisCircle").classList.add("listening");
            isActive = true;
            return;
        }

        if (isActive) {
            addMessage("You: " + text, "user");
            sendToAI(text);

            isActive = false;
            document.getElementById("jarvisCircle").classList.remove("listening");
            document.getElementById("status").innerText = "Waiting for 'Hey Jarvis'...";
        }
    };

    recognition.onerror = () => recognition.start();
    recognition.onend = () => recognition.start();

    recognition.start();
}

// 🤖 AI Request
async function sendToAI(message) {
    let response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message: message })
    });

    let data = await response.json();

    addMessage("Jarvis: " + data.reply, "bot");

    speak(data.reply);
}

// 🔊 Speak
function speak(text) {
    let speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";

    isSpeaking = true;
    document.getElementById("jarvisCircle").classList.add("speaking");

    speech.onend = () => {
        isSpeaking = false;
        document.getElementById("jarvisCircle").classList.remove("speaking");
    };

    speechSynthesis.speak(speech);
}

// 🚀 Start automatically
startJarvis();
</script>

</body>
</html>
