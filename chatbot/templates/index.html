<!DOCTYPE html>
<html>
<head>
    <title>Jarvis AI</title>

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle, #020617, #000);
            font-family: 'Orbitron', sans-serif;
            color: #00ffff;
        }

        h1 {
            text-align: center;
            padding: 10px;
            text-shadow: 0 0 10px cyan;
        }

        #chatbox {
            height: 80vh;
            overflow-y: auto;
            padding: 15px;
        }

        .msg {
            margin: 10px;
            padding: 12px;
            border-radius: 12px;
            max-width: 70%;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
        }

        .user {
            background: #22c55e;
            color: black;
            margin-left: auto;
        }

        .bot {
            background: #020617;
            border: 1px solid cyan;
        }

        #inputArea {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            background: black;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            background: #020617;
            color: white;
        }

        button {
            padding: 15px;
            background: cyan;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #00bcd4;
        }
    </style>
</head>

<body>

<h1>⚡ JARVIS AI</h1>

<div id="chatbox"></div>

<div id="inputArea">
    <input id="input" placeholder="Ask me anything...">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
    let input = document.getElementById("input");
    let message = input.value;

    if (!message) return;

    let chatbox = document.getElementById("chatbox");

    chatbox.innerHTML += `<div class="msg user">${message}</div>`;
    input.value = "";

    let response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });

    let data = await response.json();

    chatbox.innerHTML += `<div class="msg bot">${data.reply}</div>`;
    chatbox.scrollTop = chatbox.scrollHeight;
}
</script>

</body>
</html>
