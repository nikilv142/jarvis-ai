<!DOCTYPE html>
<html>
<head>
    <title>Jarvis AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <div class="chat-area" id="chat-box">
        <div class="bot">Hello Nikhil 👋 I am your Jarvis</div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Message Jarvis..." rows="1"></textarea>
        <button onclick="send()">➤</button>
    </div>

</div>

<script>

// SEND MESSAGE
function send() {
    let input = document.getElementById("input");
    let msg = input.value;

    if (!msg.trim()) return;

    let chat = document.getElementById("chat-box");

    chat.innerHTML += `<div class="user">${msg}</div>`;

    let typingDiv = document.createElement("div");
    typingDiv.className = "bot";
    typingDiv.innerText = "Jarvis is typing...";
    chat.appendChild(typingDiv);

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    })
    .then(res => res.json())
    .then(data => {
        typingDiv.remove();

        let botDiv = document.createElement("div");
        botDiv.className = "bot";

        let formattedText = data.reply
            .replace(/\*\*/g, "")   // remove **
            .replace(/\*/g, "")     // remove *
            .replace(/\n/g, "<br>");
        
        botDiv.innerHTML = `
            <div class="message">${formattedText}</div>
            <button class="copy-btn" onclick="copyText(this)">📋 Copy</button>
        `;

        chat.appendChild(botDiv);
        chat.scrollTop = chat.scrollHeight;
    });

    input.value = "";
    input.style.height = "auto";
}

// ENTER = SEND | SHIFT+ENTER = NEW LINE
document.getElementById("input").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
    }
});

// AUTO EXPAND TEXTAREA
const textarea = document.getElementById("input");
textarea.addEventListener("input", () => {
    textarea.style.height = "auto";
    textarea.style.height = textarea.scrollHeight + "px";
});

// COPY FUNCTION
function copyText(button) {
    let text = button.parentElement.querySelector(".message").innerText;

    navigator.clipboard.writeText(text);

    button.innerText = "✅ Copied!";
    setTimeout(() => {
        button.innerText = "📋 Copy";
    }, 1500);
}

</script>

</body>
</html>
