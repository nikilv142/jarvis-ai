<!DOCTYPE html>
<html>
<head>
    <title>Jarvis AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <div class="chat-area" id="chat-box">
        <div class="bot">Hello Nikhil 👋 I am your Jarvis</div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Message Jarvis..." rows="1"></textarea>
        <button onclick="send()">➤</button>
    </div>

</div>

<script>

// 🚀 STREAMING SEND FUNCTION
async function send() {
    let input = document.getElementById("input");
    let msg = input.value;

    if (!msg.trim()) return;

    let chat = document.getElementById("chat-box");

    // Show user message
    chat.innerHTML += `<div class="user">${msg}</div>`;

    // Create bot message container
    let botDiv = document.createElement("div");
    botDiv.className = "bot";
    chat.appendChild(botDiv);

    input.value = "";
    input.style.height = "auto";

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");

    let resultText = "";

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        let chunk = decoder.decode(value);
        resultText += chunk;

        // Clean text formatting
        let cleanText = resultText
            .replace(/\*\*/g, "")
            .replace(/\*/g, "")
            .replace(/`/g, "")
            .replace(/\n/g, "<br>");

        // Update UI with streaming text + copy button
        botDiv.innerHTML = `
            <div class="message">${cleanText}</div>
            <button class="copy-btn" onclick="copyText(this)">📋 Copy</button>
        `;

        chat.scrollTop = chat.scrollHeight;

        // Optional smooth effect
        await new Promise(r => setTimeout(r, 10));
    }
}

// ⌨️ ENTER = SEND | SHIFT+ENTER = NEW LINE
document.getElementById("input").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
    }
});

// 📏 AUTO EXPAND TEXTAREA
const textarea = document.getElementById("input");
textarea.addEventListener("input", () => {
    textarea.style.height = "auto";
    textarea.style.height = textarea.scrollHeight + "px";
});

// 📋 COPY FUNCTION
function copyText(button) {
    let text = button.parentElement.querySelector(".message").innerText;

    navigator.clipboard.writeText(text);

    button.innerText = "✅ Copied!";
    setTimeout(() => {
        button.innerText = "📋 Copy";
    }, 1500);
}

</script>

</body>
</html>
